<div style="max-width: 700px; margin: 0 auto; padding: 1.5rem;">
  <h1 style="font-size: 22px; font-weight: 500; margin-bottom: 1.5rem; color: var(--color-text-primary);">被動收入生成器</h1>

  <div style="background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; border: 0.5px solid var(--color-border-tertiary);">
    
    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text-primary);">你擁有的技能或專長</label>
      <textarea id="skills" placeholder="例如：寫作、設計、編程、營銷、投資..." style="width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-family: var(--font-sans); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary); min-height: 80px;"></textarea>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text-primary);">興趣或熱情領域</label>
      <textarea id="interests" placeholder="例如：健身、旅遊、個人理財、科技..." style="width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-family: var(--font-sans); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary); min-height: 80px;"></textarea>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text-primary);">初始資本</label>
      <select id="capital" style="width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-family: var(--font-sans); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary);">
        <option value="">選擇一個選項</option>
        <option value="none">幾乎沒有 (0-100 USD)</option>
        <option value="low">低 (100-1000 USD)</option>
        <option value="medium">中等 (1000-10000 USD)</option>
        <option value="high">高 (10000+ USD)</option>
      </select>
    </div>

    <div style="margin-bottom: 1.5rem;">
      <label style="display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; color: var(--color-text-primary);">可投入時間</label>
      <select id="timeframe" style="width: 100%; padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-family: var(--font-sans); font-size: 14px; background: var(--color-background-primary); color: var(--color-text-primary);">
        <option value="">選擇一個選項</option>
        <option value="minimal">最少 (每周 5 小時)</option>
        <option value="low">低 (每周 10-15 小時)</option>
        <option value="medium">中等 (每周 20-30 小時)</option>
        <option value="high">高 (每周 40+ 小時)</option>
      </select>
    </div>

    <div style="display: flex; gap: 8px;">
      <button onclick="generateIdeas()" style="flex: 1; padding: 10px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-primary); font-size: 14px; font-weight: 500; cursor: pointer;">✨ 生成點子</button>
      <button onclick="clearForm()" style="flex: 1; padding: 10px 16px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: transparent; color: var(--color-text-primary); font-size: 14px; font-weight: 500; cursor: pointer;">清空</button>
    </div>
  </div>

  <div id="results" style="display: none;"></div>
  <div id="empty" style="text-align: center; padding: 2rem 1rem; color: var(--color-text-secondary); font-size: 14px;">填寫表單並點擊「生成點子」開始探索被動收入機會</div>
</div>

<script>
const ideaDatabase = {
  writing: {
    title: "線上課程或電子書銷售",
    description: "根據你的寫作技能，創建電子書、課程或教材，在 Udemy、Gumroad 等平台銷售。",
    income: "$500-3,000/月",
    time: "3-6 個月",
    difficulty: "中等"
  },
  design: {
    title: "設計模板銷售",
    description: "創建可重用的設計模板（簡歷、演示文稿、社交媒體等），在 Etsy、Creative Market 販售。",
    income: "$300-2,000/月",
    time: "1-3 個月",
    difficulty: "簡單"
  },
  coding: {
    title: "軟體或應用開發",
    description: "開發小工具、插件或應用，通過 App Store、Google Play 或訂閱模式獲利。",
    income: "$1,000-10,000/月",
    time: "2-6 個月",
    difficulty: "困難"
  },
  marketing: {
    title: "聯盟營銷部落格",
    description: "創建部落格並撰寫相關內容，通過聯盟鏈接獲得佣金。",
    income: "$200-2,000/月",
    time: "3-12 個月",
    difficulty: "中等"
  },
  investing: {
    title: "股息投資組合",
    description: "投資高股息股票、REITs 或債券基金，獲得定期股息。",
    income: "$100-5,000/月",
    time: "立即開始",
    difficulty: "簡單"
  },
  fitness: {
    title: "線上健身課程",
    description: "錄製健身視頻或教程，在 YouTube、Patreon 或健身應用上獲利。",
    income: "$300-3,000/月",
    time: "2-4 個月",
    difficulty: "中等"
  },
  travel: {
    title: "旅遊部落格和 YouTube 頻道",
    description: "分享旅遊經歷，通過廣告、贊助和聯盟營銷獲利。",
    income: "$500-5,000/月",
    time: "6-12 個月",
    difficulty: "中等"
  },
  finance: {
    title: "財務諮詢或教練服務",
    description: "提供線上財務諮詢、線上課程或電子書。",
    income: "$1,000-5,000/月",
    time: "2-4 個月",
    difficulty: "中等"
  },
  tech: {
    title: "科技產品評測頻道",
    description: "創建 YouTube 或部落格評測新科技產品。",
    income: "$200-2,000/月",
    time: "3-6 個月",
    difficulty: "中等"
  },
  photography: {
    title: "庫存照片銷售",
    description: "將照片上傳到 Shutterstock、Adobe Stock 或 Unsplash，每次下載獲利。",
    income: "$100-1,000/月",
    time: "立即開始",
    difficulty: "簡單"
  },
  music: {
    title: "音樂授權",
    description: "創建免版稅音樂並在 Epidemic Sound、AudioJungle 販售。",
    income: "$200-2,000/月",
    time: "持續進行",
    difficulty: "中等"
  },
  dropshipping: {
    title: "代銷網店",
    description: "建立線上商店，進行代銷（無需庫存）。",
    income: "$500-3,000/月",
    time: "1-3 個月",
    difficulty: "中等"
  }
};

const skillKeywords = {
  writing: ['寫作', '編輯', '內容', '翻譯'],
  design: ['設計', '平面', 'UI/UX', '視覺'],
  coding: ['編程', '開發', '代碼', '軟體'],
  marketing: ['營銷', '行銷', '推廣', 'SEO'],
  investing: ['投資', '理財', '金融', '股票'],
  fitness: ['健身', '運動', '瑜伽', '教練'],
  travel: ['旅遊', '旅行', '探險', '背包'],
  finance: ['財務', '金錢', '稅務', '預算'],
  tech: ['科技', '技術', '電子', '程式'],
  photography: ['攝影', '相機', '照片'],
  music: ['音樂', '作曲', '製作'],
  dropshipping: ['商業', '創業', '電商', '銷售']
};

function matchSkills(input) {
  const ideas = [];
  for (const [key, keywords] of Object.entries(skillKeywords)) {
    if (keywords.some(kw => input.includes(kw))) {
      ideas.push(key);
    }
  }
  return ideas;
}

function generateIdeas() {
  const skills = document.getElementById('skills').value.trim();
  const interests = document.getElementById('interests').value.trim();
  const capital = document.getElementById('capital').value;
  const timeframe = document.getElementById('timeframe').value;

  if (!skills || !interests || !capital || !timeframe) {
    alert('請填寫所有欄位');
    return;
  }

  const matchedSkills = matchSkills(skills);
  const matchedInterests = matchSkills(interests);
  const allMatched = [...new Set([...matchedSkills, ...matchedInterests])];

  let selectedIdeas = allMatched.slice(0, 5);
  if (selectedIdeas.length < 5) {
    const available = Object.keys(ideaDatabase).filter(k => !selectedIdeas.includes(k));
    selectedIdeas = selectedIdeas.concat(available.slice(0, 5 - selectedIdeas.length));
  }

  let html = '<div style="background: var(--color-background-success); color: var(--color-text-success); padding: 8px 12px; border-radius: var(--border-radius-md); font-size: 12px; margin-bottom: 1rem; display: inline-block;">✓ 成功生成 5 個被動收入想法</div><div>';

  selectedIdeas.forEach((ideaKey, index) => {
    const idea = ideaDatabase[ideaKey];
    html += `
      <div style="background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; margin-bottom: 1rem;">
        <div style="font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 0.75rem;">${index + 1}. ${idea.title}</div>
        <div style="font-size: 14px; color: var(--color-text-secondary); line-height: 1.6; margin-bottom: 1rem;">${idea.description}</div>
        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; font-size: 13px;">
          <div style="background: var(--color-background-secondary); padding: 8px 12px; border-radius: var(--border-radius-md); color: var(--color-text-secondary);">
            <div style="color: var(--color-text-tertiary); font-size: 12px; margin-bottom: 2px;">開始產生收入</div>
            <div>${idea.time}</div>
          </div>
          <div style="background: var(--color-background-secondary); padding: 8px 12px; border-radius: var(--border-radius-md); color: var(--color-text-secondary);">
            <div style="color: var(--color-text-tertiary); font-size: 12px; margin-bottom: 2px;">預計月收入</div>
            <div>${idea.income}</div>
          </div>
          <div style="background: var(--color-background-secondary); padding: 8px 12px; border-radius: var(--border-radius-md); color: var(--color-text-secondary);">
            <div style="color: var(--color-text-tertiary); font-size: 12px; margin-bottom: 2px;">難度</div>
            <div>${idea.difficulty}</div>
          </div>
        </div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('results').innerHTML = html;
  document.getElementById('results').style.display = 'block';
  document.getElementById('empty').style.display = 'none';
}

function clearForm() {
  document.getElementById('skills').value = '';
  document.getElementById('interests').value = '';
  document.getElementById('capital').value = '';
  document.getElementById('timeframe').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('empty').style.display = 'block';
}
</script>
